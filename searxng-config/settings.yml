use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

# These engines either target niche networks or perform a slow remote
# initialization. They are not needed for customer-support web search and can
# make startup/searches noisy or unnecessarily slow.
engines:
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true
  - name: wikidata
    disabled: true

ui:
  static_use_hash: true
