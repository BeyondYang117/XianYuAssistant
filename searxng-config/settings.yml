use_default_settings:
  engines:
    keep_only:
      - baidu

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

outgoing:
  # Keep a single unreachable provider from holding up the whole customer
  # support request. The application has its own four-second upper bound.
  request_timeout: 3.0
  max_redirects: 2

ui:
  static_use_hash: true
